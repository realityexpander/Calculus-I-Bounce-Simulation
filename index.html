<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Bounce Physics Simulation & Derivatives</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --text-color: #e2e8f0;
            --primary: #3b82f6;
            --velocity-color: #10b981;
            --accel-color: #ef4444;
            --border: #2d2d34;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .value-display {
            font-family: monospace;
            font-size: 0.9rem;
            color: #fff;
        }

        .btn-row {
            margin-top: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .workspace {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .workspace {
                grid-template-columns: 1fr;
            }
            .animation-box {
                height: 150px !important;
            }
        }

        .animation-box {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            position: relative;
            height: 100%;
            min-height: 300px;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .ball {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            transform: translateY(0);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .plots-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .plot-wrapper {
            position: relative;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
        }

        .plot-title {
            position: absolute;
            top: 6px;
            left: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 110px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>5-Bounce Simulation & Calculus Derivatives</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>Gravity (g): <span id="g-val" class="value-display">9.81</span> m/s²</label>
            <input type="range" id="gravity" min="4" max="25" step="0.1" value="9.81">
        </div>
        <div class="control-group">
            <label>Bounce Efficiency (e): <span id="e-val" class="value-display">0.70</span></label>
            <input type="range" id="efficiency" min="0.3" max="0.9" step="0.01" value="0.70">
        </div>
        <div class="control-group">
            <label>Initial Height: <span id="h-val" class="value-display">10</span> m</label>
            <input type="range" id="height" min="5" max="15" step="0.5" value="10">
        </div>
    </div>
    
    <div class="btn-row">
        <button id="reset-btn">Drop Ball / Restart Animation</button>
    </div>

    <div class="workspace">
        <div class="animation-box">
            <div id="ball" class="ball"></div>
        </div>

        <div class="plots-container">
            <div class="plot-wrapper">
                <div class="plot-title" style="color: var(--primary);">Position (Height y)</div>
                <canvas id="posPlot"></canvas>
            </div>
            <div class="plot-wrapper">
                <div class="plot-title" style="color: var(--velocity-color);">Velocity (dy/dt)</div>
                <canvas id="velPlot"></canvas>
            </div>
            <div class="plot-wrapper">
                <div class="plot-title" style="color: var(--accel-color);">Acceleration (d²y/dt²)</div>
                <canvas id="accelPlot"></canvas>
            </div>
        </div>
    </div>

    <div>
        ©2026 Chris Athanas
        Link to source on <a href="https://github.com/realityexpander/Calculus-I-Bounce-Simulation/edit/main/index.html">Github</a>
    </div>
</div>

<script>
    let g = 9.81;
    let e = 0.70;
    let initialH = 10;
    
    let timeData = [];
    let posData = [];
    let velData = [];
    let accelData = [];
    let bounceTimes = [];
    let totalDuration = 0;

    let startTime = null;
    let animationFrameId = null;

    const ballEl = document.getElementById('ball');
    const posCanvas = document.getElementById('posPlot');
    const velCanvas = document.getElementById('velPlot');
    const accelCanvas = document.getElementById('accelPlot');

    const posCtx = posCanvas.getContext('2d');
    const velCtx = velCanvas.getContext('2d');
    const accelCtx = accelCanvas.getContext('2d');

    document.getElementById('gravity').addEventListener('input', (e) => { g = parseFloat(e.target.value); document.getElementById('g-val').textContent = g.toFixed(2); calculatePhysics(); restartAnimation(); });
    document.getElementById('efficiency').addEventListener('input', (el) => { e = parseFloat(el.target.value); document.getElementById('e-val').textContent = e.toFixed(2); calculatePhysics(); restartAnimation(); });
    document.getElementById('height').addEventListener('input', (ev) => { initialH = parseFloat(ev.target.value); document.getElementById('h-val').textContent = initialH.toFixed(1); calculatePhysics(); restartAnimation(); });
    document.getElementById('reset-btn').addEventListener('click', () => { restartAnimation(); });

    function resizeCanvases() {
        [posCanvas, velCanvas, accelCanvas].forEach(canvas => {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
        });
        renderStaticGraphs();
    }

    function calculatePhysics() {
        timeData = [];
        posData = [];
        velData = [];
        accelData = [];
        bounceTimes = [];

        let t = 0;
        const dt = 0.005;
        
        let y = initialH;
        let v = 0;
        let bounces = 0;
        const maxBounces = 5;

        while (bounces < maxBounces && t < 15) {
            timeData.push(t);
            posData.push(y);
            velData.push(v);
            
            let nextY = y + v * dt + 0.5 * -g * dt * dt;
            if (nextY <= 0 && v < 0) {
                accelData.push(180);
                bounceTimes.push(t);
                y = 0;
                v = -v * e;
                bounces++;
            } else {
                accelData.push(-g);
                y = nextY;
                v = v + -g * dt;
            }
            t += dt;
        }
        totalDuration = t;
    }

    function renderStaticGraphs() {
        drawGraph(posCtx, posCanvas, posData, varColor('--primary'), 0, initialH * 1.1);
        drawGraph(velCtx, velCanvas, velData, varColor('--velocity-color'), -Math.sqrt(2*g*initialH), Math.sqrt(2*g*initialH));
        drawGraph(accelCtx, accelCanvas, accelData, varColor('--accel-color'), -g * 2, 50);
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function drawGraph(ctx, canvas, data, color, minVal, maxVal) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(data.length === 0) return;

        ctx.lineWidth = 2 * window.devicePixelRatio;
        ctx.strokeStyle = color;
        ctx.beginPath();

        for (let i = 0; i < data.length; i++) {
            const x = (i / (data.length - 1)) * canvas.width;
            const y = canvas.height - ((data[i] - minVal) / (maxVal - minVal)) * canvas.height;
            
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.lineWidth = 1 * window.devicePixelRatio;
        ctx.strokeStyle = '#334155';
        ctx.setLineDash([4 * window.devicePixelRatio, 4 * window.devicePixelRatio]);
        ctx.beginPath();
        const zeroY = canvas.height - ((0 - minVal) / (maxVal - minVal)) * canvas.height;
        ctx.moveTo(0, zeroY);
        ctx.lineTo(canvas.width, zeroY);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let elapsed = (timestamp - startTime) / 1000;

        if (elapsed > totalDuration) {
            elapsed = totalDuration;
        }

        const index = Math.min(
            Math.floor((elapsed / totalDuration) * timeData.length),
            timeData.length - 1
        );

        const currentY = posData[index];
        const containerHeight = ballEl.parentElement.clientHeight - 24;
        const visualY = (currentY / (initialH * 1.1)) * containerHeight;
        ballEl.style.transform = `translateY(${-visualY}px)`;

        renderStaticGraphs();
        const sweepX = (index / (timeData.length - 1)) * posCanvas.width;
        
        [posCtx, velCtx, accelCtx].forEach((ctx, i) => {
            const cnv = [posCanvas, velCanvas, accelCanvas][i];
            const dataset = [posData, velData, accelData][i];
            const bounds = [
                [0, initialH * 1.1],
                [-Math.sqrt(2*g*initialH), Math.sqrt(2*g*initialH)],
                [-g * 2, 50]
            ][i];

            const trackerY = cnv.height - ((dataset[index] - bounds[0]) / (bounds[1] - bounds[0])) * cnv.height;

            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1 * window.devicePixelRatio;
            ctx.beginPath();
            ctx.moveTo(sweepX, 0);
            ctx.lineTo(sweepX, cnv.height);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sweepX, trackerY, 5 * window.devicePixelRatio, 0, 2 * Math.PI);
            ctx.fill();
        });

        if (elapsed < totalDuration) {
            animationFrameId = requestAnimationFrame(animate);
        }
    }

    function restartAnimation() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        startTime = null;
        animationFrameId = requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvases);
    calculatePhysics();
    setTimeout(() => {
        resizeCanvases();
        restartAnimation();
    }, 100);
</script>
</body>
</html>
